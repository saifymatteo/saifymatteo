name: Next.js deploy

on:
  push:
    tags:
      - 'dev/nextjs/v*'
      - 'release/nextjs/v*'

concurrency:
  group: nextjs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Resolve deploy mode from tag
        id: resolve
        run: |
          if [[ "$GITHUB_REF_NAME" == dev/nextjs/* ]]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          else
            echo "mode=promote" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npx prettier . --check

      - name: ESLint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build (vinext)
        run: npm run build:vinext

      - name: Upload preview version (not promoted)
        if: steps.resolve.outputs.mode == 'preview'
        run: |
          set -o pipefail
          npx wrangler versions upload --config dist/server/wrangler.json 2>&1 | tee version-upload.log
          grep -oE 'https://[a-z0-9]+-saiful-mashuri\.[^ ]*workers\.dev' version-upload.log >> "$GITHUB_STEP_SUMMARY" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to production
        if: steps.resolve.outputs.mode == 'promote'
        run: npx vinext-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
