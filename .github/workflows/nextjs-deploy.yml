name: Next.js deploy

on:
  push:
    tags:
      - 'release/nextjs/v*'

concurrency:
  group: nextjs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Resolve deploy target from tag
        id: resolve
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "target=staging" >> "$GITHUB_OUTPUT"
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npx prettier . --check

      - name: ESLint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: node --test --experimental-strip-types tests/theme.test.ts

      - name: Build (vinext)
        run: npm run build:vinext

      - name: Deploy to Cloudflare Workers
        run: npx vinext-cloudflare deploy --env ${{ steps.resolve.outputs.target }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
